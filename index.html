
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
        <h1>Lotto Number Generator</h1>
        <button id="generate-btn">Generate Numbers</button>
        <div class="action-buttons">
            <button id="copy-btn" class="secondary-btn">Copy Numbers</button>
            <button id="clear-btn" class="secondary-btn">Clear</button>
        </div>
        <div id="numbers-container"></div>
        
        <div class="voc-section">
            <hr>
            <h3>Improvement Feedback (VOC)</h3>
            <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST" id="voc-form">
                <input type="email" name="email" placeholder="Your email (optional)" class="voc-input">
                <textarea name="message" placeholder="How can we improve?" required class="voc-textarea"></textarea>
                <button type="submit" class="secondary-btn">Send Feedback</button>
            </form>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
