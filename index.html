
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Number Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="voc-open-btn">의견보내기</button>
    <div class="main-wrapper">
        <div class="container">
            <button id="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>
            <h1>Lotto Number Generator</h1>
            <button id="generate-btn">Generate Numbers</button>
            <div class="action-buttons">
                <button id="copy-btn" class="secondary-btn">Copy Numbers</button>
                <button id="clear-btn" class="secondary-btn">Clear</button>
            </div>
            <div id="numbers-container"></div>
        </div>

        <div class="comments-section">
            <div id="disqus_thread"></div>
            <script>
                /**
                *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */

                var disqus_config = function () {
                this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
                this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                };
                */
                (function() { // DON'T EDIT BELOW THIS LINE
                var d = document, s = d.createElement('script');
                s.src = 'https://project-kyk2d06i1i.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>
    </div>

    <!-- VOC Modal -->
    <div id="voc-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3>Improvement Feedback (VOC)</h3>
            <form action="https://formspree.io/f/mlgzglkg" method="POST" id="voc-form">
                <input type="email" name="email" placeholder="Your email (optional)" class="voc-input">
                <textarea name="message" placeholder="How can we improve?" required class="voc-textarea"></textarea>
                <button type="submit" class="secondary-btn">Send Feedback</button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
